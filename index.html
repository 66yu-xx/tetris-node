<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Tetris Node</title>
  </head>

  <body>
    <div id="app">
      <section id="startScreen" class="start-screen">
        <div class="start-card">
          <h1>俄罗斯方块</h1>
          <p>电脑：鼠标拖动左右移动 / 右键旋转 / 左键双击或下滑直接落下</p>
          <p>手机：轻点旋转 / 左右拖动移动 / 下滑直接落下</p>
          <p>音效：默认开启，可在游戏中关闭</p>
          <button id="startBtn" class="primary-btn">开始游戏</button>
        </div>
      </section>

      <section id="gameScreen" class="game-screen hidden">
        <main class="game-layout">
          <section class="board-panel" aria-label="游戏棋盘">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
          </section>

          <aside class="side-panel" aria-label="游戏信息和控制">
            <section class="next-card">
              <h2>下一个</h2>
              <canvas id="nextCanvas" width="120" height="120"></canvas>
            </section>

            <section class="score-card">
              <div class="score-row">
                <span>分数</span>
                <strong id="scoreText">0</strong>
              </div>
              <div class="score-row">
                <span>消行</span>
                <strong id="linesText">0</strong>
              </div>
              <div class="score-row">
                <span>等级</span>
                <strong id="levelText">1</strong>
              </div>
            </section>

            <section class="control-card">
              <div class="touch-controls">
                <button id="leftBtn" type="button">←</button>
                <button id="rotateBtn" type="button">旋转</button>
                <button id="rightBtn" type="button">→</button>
                <button id="dropBtn" type="button">落下</button>
              </div>

              <div class="action-controls">
                <button id="pauseBtn" type="button">暂停</button>
                <button id="restartBtn" type="button">重开</button>
                <button id="exitBtn" type="button">退出</button>
                <button id="soundBtn" type="button">音效：开</button>
              </div>
            </section>

            <p id="statusText" class="status-text">准备开始</p>
          </aside>
        </main>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
